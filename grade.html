<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000020;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            line-height: 1.8;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Grade Calculator</h1>

        <form id="gradeForm">
            <label for="sub1">Subject 1 Marks:</label>
            <input type="number" id="sub1" min="0" max="100"
                   placeholder="Enter marks (0-100)" required>

            <label for="sub2">Subject 2 Marks:</label>
            <input type="number" id="sub2" min="0" max="100"
                   placeholder="Enter marks (0-100)" required>

            <label for="sub3">Subject 3 Marks:</label>
            <input type="number" id="sub3" min="0" max="100"
                   placeholder="Enter marks (0-100)" required>

            <label for="sub4">Subject 4 Marks:</label>
            <input type="number" id="sub4" min="0" max="100"
                   placeholder="Enter marks (0-100)" required>

            <label for="sub5">Subject 5 Marks:</label>
            <input type="number" id="sub5" min="0" max="100"
                   placeholder="Enter marks (0-100)" required>

            <button type="submit">Calculate Grade</button>
        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <script>
        document.getElementById("gradeForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let marks = [];
            let valid = true;

            for (let i = 1; i <= 5; i++) {
                let input = document.getElementById("sub" + i);
                let value = input.value.trim();
                let mark = Number(value);

                if (value === "" || !Number.isFinite(mark) ||
                    mark < 0 || mark > 100) {
                    valid = false;
                    break;
                }

                marks.push(mark);
            }

            let result = document.getElementById("result");

            if (!valid) {
                result.innerHTML =
                    '<p class="error">Please enter valid marks from 0 to 100 for all subjects.</p>';
                return;
            }

            let total = marks.reduce((sum, mark) => sum + mark, 0);
            let average = total / 5;
            let percentage = average;
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F (Fail)";
            }

            result.innerHTML =
                "<h3>Result</h3>" +
                "Total Marks: " + total + " / 500<br>" +
                "Average: " + average.toFixed(2) + "<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: <strong>" + grade + "</strong>";
        });
    </script>

</body>
</html>
